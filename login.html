
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Body Mode</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .auth-section {
      min-height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      padding: 40px;
      background: #151515;
      border: 1px solid #383838;
      border-radius: 18px;
    }

    .auth-card h1 {
      font-size: 34px;
      letter-spacing: -1px;
      text-align: center;
    }

    .auth-card h1 span {
      color: #e8bc50;
    }

    .auth-card p {
      color: #aaa;
      text-align: center;
    }

    .auth-card label {
      display: block;
      margin: 18px 0 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .auth-card input {
      width: 100%;
      padding: 15px;
      background: #222;
      border: 1px solid #444;
      border-radius: 8px;
      color: white;
      font-size: 15px;
    }

    .auth-card input:focus {
      outline: 1px solid #e8bc50;
    }

    .auth-card button {
      width: 100%;
      margin-top: 25px;
      cursor: pointer;
      border: none;
    }

    .auth-bottom {
      margin-top: 25px;
      font-size: 13px;
    }

    .auth-bottom a {
      color: #e8bc50;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
    }

    .language-select {
      background: #151515;
      color: #e8bc50;
      border: 1px solid #e8bc50;
      border-radius: 8px;
      padding: 9px;
      cursor: pointer;
      font-size: 13px;
      max-width: 150px;
    }

    .navbar nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    @media (max-width: 500px) {
      .auth-card {
        padding: 28px 20px;
      }

      .language-select {
        max-width: 120px;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">
    <a href="index.html" class="logo">
      ⚡ BODY<span>MODE</span>
    </a>

    <nav>
      <a href="index.html" data-i18n="home">Home</a>
      <a href="signup.html" data-i18n="signup">Sign Up</a>

      <select
        id="languageSelect"
        class="language-select"
        aria-label="Choose language"
      ></select>
    </nav>
  </header>

  <section class="auth-section">
    <div class="auth-card">

      <h1 data-i18n="welcome">
        WELCOME BACK
      </h1>

      <p data-i18n="loginDesc">
        Login to your Body Mode account.
      </p>

      <form id="loginForm">

        <label for="email" data-i18n="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          data-i18n-placeholder="emailPlaceholder"
          autocomplete="email"
          required
        >

        <label for="password" data-i18n="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          data-i18n-placeholder="passwordPlaceholder"
          autocomplete="current-password"
          required
        >

        <button
          type="submit"
          class="btn"
          id="loginBtn"
          data-i18n="login"
        >
          LOGIN
        </button>

        <div id="message" role="status"></div>

      </form>

      <p class="auth-bottom">
        <span data-i18n="noAccount">
          Don't have an account?
        </span>

        <a href="signup.html" data-i18n="createAccount">
          Create Account
        </a>
      </p>

    </div>
  </section>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <!-- LANGUAGES -->
  <script src="translations.js"></script>

  <!-- LOGIN -->
  <script>
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    let isLoggingIn = false;

    loginForm.addEventListener("submit", async function(e) {
      e.preventDefault();

      if (isLoggingIn) return;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      isLoggingIn = true;
      loginBtn.disabled = true;

      message.textContent = t("loggingIn");
      message.style.color = "#e8bc50";

      try {
        if (typeof supabaseClient === "undefined") {
          throw new Error("Supabase is not configured.");
        }

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          message.textContent = error.message;
          message.style.color = "#ff6666";
          return;
        }

        if (data.user) {
          window.location.href = "dashboard.html";
        }

      } catch (error) {
        console.error("Login error:", error);

        message.textContent = t("connectionError");
        message.style.color = "#ff6666";

      } finally {
        isLoggingIn = false;
        loginBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
