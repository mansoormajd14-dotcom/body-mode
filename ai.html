<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Coach - Body Mode</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">⚡ Body Mode</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="courses.html">Courses</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="ai.html">AI Coach</a>
  </nav>
</header>

<section class="ai-section">
  <div class="auth-glow"></div>

  <div class="ai-header">
    <div class="auth-icon">⚡</div>
    <h1><span>AI</span> COACH</h1>
    <p>Ask about workouts, nutrition, recovery, and consistency.</p>
  </div>

  <div class="chat-box">
    <div class="message ai">
      <strong>Body Mode AI:</strong>
      <p>Welcome. What is your fitness goal?</p>
    </div>

    <div class="message user">
      <strong>You:</strong>
      <p>I want to build muscle.</p>
    </div>

    <div class="chat-input">
      <input type="text" placeholder="Ask your AI coach...">
      <button class="btn gold">SEND</button>
    </div>
  </div>
</section>

</body>
</html>
