
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Profile | Body Mode</title>
<link rel="stylesheet" href="style.css">

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:white;font-family:Arial,sans-serif}
.onboarding{min-height:100vh;padding:120px 18px 60px;display:flex;justify-content:center}
.panel{width:100%;max-width:750px;background:#151515;border:1px solid #383838;border-radius:20px;padding:35px}
.panel h1{font-size:32px}
.panel h1 span{color:#e8bc50}
.muted{color:#aaa;line-height:1.6}
.progress{height:8px;border-radius:20px;background:#333;overflow:hidden;margin:26px 0 12px}
#progressFill{height:100%;width:0;background:#e8bc50;transition:width .25s}
.step-meta{color:#aaa;font-size:13px;text-align:end}
.question{margin:23px 0}
.question label{display:block;margin-bottom:10px;font-weight:600}
.question input,.question select,.question textarea{
width:100%;padding:14px;background:#222;border:1px solid #555;
border-radius:9px;color:white;font-size:15px
}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.option{border:1px solid #444;background:#202020;color:white;border-radius:10px;padding:14px;text-align:start;cursor:pointer}
.option.active{border-color:#e8bc50;background:#332b19;color:#f4d27d}
.actions{display:flex;gap:12px;margin-top:32px}
.actions button{flex:1;border:1px solid #e8bc50;border-radius:9px;padding:15px;cursor:pointer;font-weight:800;background:#e8bc50;color:#111}
.actions button.secondary{background:transparent;color:#e8bc50}
.actions button:disabled{opacity:.5;cursor:not-allowed}
#status{margin-top:16px;color:#e8bc50;overflow-wrap:anywhere}
.summary{background:#222;padding:16px;border-radius:12px;line-height:1.8;overflow-wrap:anywhere}
.language-select{background:#151515;color:#e8bc50;border:1px solid #e8bc50;border-radius:8px;padding:9px;max-width:155px}
.navbar nav{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
[dir="rtl"] .panel{text-align:right}
@media(max-width:600px){
.panel{padding:24px 18px}
.options{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="navbar">
<a href="index.html" class="logo">⚡ BODY<span>MODE</span></a>
<nav>
<a href="dashboard.html" data-i18n="dashboard">Dashboard</a>
<select id="languageSelect" class="language-select" aria-label="Language"></select>
</nav>
</header>

<main class="onboarding">
<section class="panel">

<p id="profileEyebrow" style="color:#e8bc50">
BUILD YOUR PERSONAL PROFILE
</p>

<h1>
<span id="profileTitle">YOUR BODY.</span>
<span id="profileTitleGold">YOUR PLAN.</span>
</h1>

<p class="muted" id="profileIntro">
Answer a few questions so Body Mode can suggest a plan that fits your life.
</p>

<div class="progress">
<div id="progressFill"></div>
</div>

<div class="step-meta" id="stepMeta"></div>

<form id="wizard" novalidate>
<div id="questions"></div>

<div class="actions">
<button type="button" class="secondary" id="backBtn">
<span id="backText">BACK</span>
</button>

<button type="submit" id="nextBtn">CONTINUE →</button>
</div>
</form>

<p id="status" role="status"></p>

</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

Object.assign(languageData, extraLanguages);

const state = {};
let step = 0;
let user = null;
let busy = false;

const $ = id => document.getElementById(id);

function currentLang() {
  const lang = typeof getLanguage === "function"
    ? getLanguage()
    : localStorage.getItem("bodymode_language") || "en";

  return languageData[lang] ? lang : "en";
}

function tx(key) {
  return languageData[currentLang()][key] ||
         languageData.en[key] ||
         key;
}

function esc(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function field(key, label, required = true) {
  return `
    <div class="question">
      <label for="q_${key}">${tx(label)}</label>
      <input
        id="q_${key}"
        name="${key}"
        type="number"
        step="any"
        value="${esc(state[key])}"
        ${required ? "required" : ""}
      >
    </div>
  `;
}

function choices(key, label, options) {
  return `
    <div class="question">
      <label>${tx(label)}</label>
      <div class="options">
        ${options.map(([value, text]) => `
          <button
            type="button"
            class="option ${state[key] === value ? "active" : ""}"
            aria-pressed="${state[key] === value}"
            data-key="${key}"
            data-value="${value}"
          >${tx(text)}</button>
        `).join("")}
      </div>
    </div>
  `;
}

function selectField(key, label, options) {
  return `
    <div class="question">
      <label for="q_${key}">${tx(label)}</label>
      <select id="q_${key}" name="${key}">
        <option value="">${tx("choose")}</option>
        ${options.map(([value, text]) => `
          <option
            value="${value}"
            ${state[key] === value ? "selected" : ""}
          >${typeof text === "function" ? text() : tx(text)}</option>
        `).join("")}
      </select>
    </div>
  `;
}

function textareaField(key, label) {
  return `
    <div class="question">
      <label for="q_${key}">
        ${tx(label)} (${tx("optional")})
      </label>
      <textarea id="q_${key}" name="${key}" rows="3">${esc(state[key])}</textarea>
    </div>
  `;
}

const numberOptions = (unit, numbers) =>
  numbers.map(n => [
    String(n),
    () => `${n} ${tx(unit)}`
  ]);

const stages = [
  {
    title: "about",
    required: ["age", "height", "weight"],
    html: () =>
      field("age", "age") +
      field("height", "height") +
      field("weight", "weight") +
      choices("sex", "sex", [
        ["male", "male"],
        ["female", "female"],
        ["prefer_not", "preferNot"]
      ])
  },
  {
    title: "goalStage",
    required: ["goal", "timeline"],
    html: () =>
      choices("goal", "goal", [
        ["muscle", "muscle"],
        ["fat_loss", "fatLoss"],
        ["strength", "strength"],
        ["fitness", "fitness"],
        ["maintain", "maintain"]
      ]) +
      (
        ["muscle", "fat_loss", "maintain"].includes(state.goal)
          ? field("targetWeight", "targetWeight", false)
          : ""
      ) +
      selectField("timeline", "timeline", [
        ["3months", "threeMonths"],
        ["6months", "sixMonths"],
        ["12months", "twelveMonths"],
        ["flexible", "flexible"]
      ])
  },
  {
    title: "trainingStage",
    required: ["location", "experience", "days", "duration"],
    html: () =>
      choices("location", "location", [
        ["gym", "gym"],
        ["home", "home"],
        ["both", "both"]
      ]) +
      choices("experience", "experience", [
        ["beginner", "beginner"],
        ["intermediate", "intermediate"],
        ["advanced", "advanced"]
      ]) +
      selectField("days", "days", numberOptions("daysUnit", [2,3,4,5,6])) +
      selectField("duration", "duration", numberOptions("minutes", [20,30,45,60,90])) +
      (
        ["home", "both"].includes(state.location)
          ? choices("equipment", "equipment", [
              ["none", "none"],
              ["dumbbells", "dumbbells"],
              ["bands", "bands"],
              ["full", "full"]
            ])
          : ""
      )
  },
  {
    title: "nutritionStage",
    required: ["diet", "meals", "cooking"],
    html: () =>
      choices("diet", "diet", [
        ["anything", "anything"],
        ["vegetarian", "vegetarian"],
        ["vegan", "vegan"],
        ["halal", "halal"]
      ]) +
      selectField("meals", "meals", numberOptions("mealsUnit", [2,3,4,5])) +
      choices("cooking", "cooking", [
        ["quick", "quick"],
        ["medium", "medium"],
        ["long", "long"]
      ]) +
      textareaField("allergies", "allergies") +
      textareaField("foodPreferences", "foodPreferences")
  },
  {
    title: "lifestyleStage",
    required: ["activity", "sleep", "obstacle"],
    html: () =>
      selectField("activity", "activity", [
        ["sedentary", "sedentary"],
        ["light", "light"],
        ["active", "active"],
        ["very_active", "veryActive"]
      ]) +
      selectField("sleep", "sleep", [
        ["under6", "under6"],
        ["6to7", "sixTo7"],
        ["7to8", "sevenTo8"],
        ["over8", "over8"]
      ]) +
      choices("obstacle", "obstacle", [
        ["time", "time"],
        ["nutrition", "nutritionObstacle"],
        ["consistency", "consistency"],
        ["knowledge", "knowledge"]
      ]) +
      textareaField("limitations", "limitations")
  },
  {
    title: "reviewStage",
    required: [],
    html: () => `
      <p class="muted">${tx("reviewIntro")}</p>
      <div class="summary">
        ${Object.entries(state)
          .filter(([,value]) => value !== "")
          .map(([key,value]) => `
            <p>
              <strong>${esc(fieldLabel(key))}:</strong>
              ${esc(optionLabel(key,value))}
            </p>
          `).join("")}
      </div>
    `
  }
];

const fieldKeys = {
  age:"age",height:"height",weight:"weight",sex:"sex",
  goal:"goal",targetWeight:"targetWeight",timeline:"timeline",
  location:"location",experience:"experience",days:"days",
  duration:"duration",equipment:"equipment",diet:"diet",
  meals:"meals",cooking:"cooking",allergies:"allergies",
  foodPreferences:"foodPreferences",activity:"activity",
  sleep:"sleep",obstacle:"obstacle",limitations:"limitations"
};

const valueKeys = {
  sex:{
    male:"male",female:"female",prefer_not:"preferNot"
  },
  goal:{
    muscle:"muscle",fat_loss:"fatLoss",strength:"strength",
    fitness:"fitness",maintain:"maintain"
  },
  timeline:{
    "3months":"threeMonths","6months":"sixMonths",
    "12months":"twelveMonths",flexible:"flexible"
  },
  location:{
    gym:"gym",home:"home",both:"both"
  },
  experience:{
    beginner:"beginner",intermediate:"intermediate",advanced:"advanced"
  },
  equipment:{
    none:"none",dumbbells:"dumbbells",bands:"bands",full:"full"
  },
  diet:{
    anything:"anything",vegetarian:"vegetarian",vegan:"vegan",halal:"halal"
  },
  cooking:{
    quick:"quick",medium:"medium",long:"long"
  },
  activity:{
    sedentary:"sedentary",light:"light",
    active:"active",very_active:"veryActive"
  },
  sleep:{
    under6:"under6","6to7":"sixTo7",
    "7to8":"sevenTo8",over8:"over8"
  },
  obstacle:{
    time:"time",nutrition:"nutritionObstacle",
    consistency:"consistency",knowledge:"knowledge"
  }
};

function fieldLabel(key) {
  return fieldKeys[key] ? tx(fieldKeys[key]) : key;
}

function optionLabel(key, value) {
  const translationKey = valueKeys[key]?.[value];

  if (translationKey) return tx(translationKey);
  if (key === "days") return `${value} ${tx("daysUnit")}`;
  if (key === "duration") return `${value} ${tx("minutes")}`;
  if (key === "meals") return `${value} ${tx("mealsUnit")}`;

  return value;
}

function collect() {
  document.querySelectorAll(
    "#questions input, #questions select, #questions textarea"
  ).forEach(input => {
    state[input.name] = input.value.trim();
  });
}

function render() {
  const current = stages[step];

  $("questions").innerHTML =
    `<h2>${tx(current.title)}</h2>` + current.html();

  $("stepMeta").textContent =
    `${tx("step")} ${step + 1} ${tx("of")} ${stages.length}`;

  $("progressFill").style.width =
    `${((step + 1) / stages.length) * 100}%`;

  $("backBtn").disabled = busy || step === 0;
  $("nextBtn").disabled = busy;

  $("nextBtn").textContent =
    step === stages.length - 1 ? tx("save") : tx("next");

  $("backText").textContent = tx("back");
  $("profileEyebrow").textContent = tx("eyebrow");
  $("profileTitle").textContent = tx("title1");
  $("profileTitleGold").textContent = tx("title2");
  $("profileIntro").textContent = tx("intro");

  document.querySelectorAll(".option").forEach(button => {
    button.addEventListener("click", () => {
      collect();
      state[button.dataset.key] = button.dataset.value;
      $("status").textContent = "";
      render();
    });
  });
}

function validateStep() {
  for (const key of stages[step].required) {
    if (!state[key]) {
      $("status").textContent = tx("requiredError");
      return false;
    }
  }

  if (step === 0) {
    const age = Number(state.age);
    const height = Number(state.height);
    const weight = Number(state.weight);

    if (
      !Number.isFinite(age) ||
      !Number.isFinite(height) ||
      !Number.isFinite(weight) ||
      age < 16 || age > 100 ||
      height < 100 || height > 250 ||
      weight < 25 || weight > 350
    ) {
      $("status").textContent = tx("measureError");
      return false;
    }
  }

  $("status").textContent = "";
  return true;
}

$("backBtn").addEventListener("click", () => {
  if (step > 0 && !busy) {
    collect();
    step--;
    $("status").textContent = "";
    render();
  }
});

$("wizard").addEventListener("submit", async event => {
  event.preventDefault();

  if (busy) return;

  collect();

  if (!validateStep()) return;

  if (step < stages.length - 1) {
    step++;
    render();
    return;
  }

  if (!user) {
    $("status").textContent = tx("loginError");
    return;
  }

  busy = true;
  render();
  $("status").textContent = tx("saving");

  try {
    const { error } = await supabaseClient
      .from("fitness_profiles")
      .upsert({
        user_id: user.id,
        answers: state,
        updated_at: new Date().toISOString()
      }, {
        onConflict: "user_id"
      });

    if (error) throw error;

    window.location.href = "dashboard.html";

  } catch (error) {
    busy = false;
    render();
    $("status").textContent =
      tx("saveError") + " " + error.message;
  }
});

document.addEventListener("bodymode:languagechange", () => {
  collect();
  render();
});

async function initialize() {
  $("status").textContent = tx("checking");

  try {
    if (typeof supabaseClient === "undefined") {
      throw new Error("Supabase is not configured.");
    }

    const { data, error } =
      await supabaseClient.auth.getUser();

    if (error || !data.user) {
      window.location.href = "login.html";
      return;
    }

    user = data.user;

    const result = await supabaseClient
      .from("fitness_profiles")
      .select("answers")
      .eq("user_id", user.id)
      .maybeSingle();

    if (result.error) throw result.error;

    if (result.data?.answers) {
      Object.assign(state, result.data.answers);
    }

    $("status").textContent = "";
    render();

  } catch (error) {
    $("status").textContent = error.message;
    console.error("Onboarding error:", error);
  }
}

render();
initialize();
</script>
