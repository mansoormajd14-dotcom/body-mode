
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Body Mode</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #0b0b0b;
      color: white;
      margin: 0;
    }

    .auth-section {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 100px 20px 50px;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      background: #151515;
      border: 1px solid #444;
      border-radius: 20px;
      padding: 40px;
    }

    .auth-card h1 {
      text-align: center;
      font-size: 34px;
      margin-bottom: 12px;
    }

    .auth-card h1 span {
      color: #e8bc50;
    }

    .auth-subtitle {
      color: #aaa;
      text-align: center;
      margin-bottom: 30px;
    }

    .auth-card label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 600;
      font-size: 14px;
    }

    .auth-card input {
      width: 100%;
      padding: 15px;
      background: #222;
      border: 1px solid #555;
      border-radius: 9px;
      color: white;
      font-size: 15px;
    }

    .auth-card input:focus {
      outline: none;
      border-color: #e8bc50;
    }

    .auth-card button {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 25px;
      border: none;
      border-radius: 9px;
      background: #e8bc50;
      color: #111;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    .auth-card button:hover {
      background: #ffd76e;
    }

    .auth-card button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      line-height: 1.6;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .auth-bottom {
      text-align: center;
      margin-top: 25px;
      color: #aaa;
      font-size: 14px;
    }

    .auth-bottom a {
      color: #e8bc50;
      text-decoration: none;
      font-weight: bold;
    }

    .selected-plan {
      text-align: center;
      color: #e8bc50;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .language-select {
      background: #151515;
      color: #e8bc50;
      border: 1px solid #e8bc50;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      cursor: pointer;
      max-width: 155px;
    }

    .navbar nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    @media (max-width: 500px) {
      .auth-card {
        padding: 28px 20px;
      }

      .language-select {
        max-width: 125px;
        padding: 7px;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">
    <a href="index.html" class="logo">
      ⚡ BODY<span>MODE</span>
    </a>

    <nav>
      <a href="index.html" data-i18n="home">
        Home
      </a>

      <a href="login.html" data-i18n="login">
        LOGIN
      </a>

      <select
        id="languageSelect"
        class="language-select"
        aria-label="Choose language"
      ></select>
    </nav>
  </header>

  <main class="auth-section">
    <div class="auth-card">

      <h1 data-i18n="createAccount">
        CREATE ACCOUNT
      </h1>

      <p class="auth-subtitle" data-i18n="signupDesc">
        Start your transformation today.
      </p>

      <p class="selected-plan" id="selectedPlan"></p>

      <form id="signupForm">

        <label for="fullName" data-i18n="fullName">
          Full Name
        </label>

        <input
          type="text"
          id="fullName"
          placeholder="Enter your full name"
          data-i18n-placeholder="namePlaceholder"
          autocomplete="name"
          required
        >

        <label for="email" data-i18n="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          data-i18n-placeholder="emailPlaceholder"
          autocomplete="email"
          required
        >

        <label for="password" data-i18n="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Create a password (8+ characters)"
          data-i18n-placeholder="createPassword"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <button
          type="submit"
          id="signupBtn"
          data-i18n="createAccount"
        >
          CREATE ACCOUNT
        </button>

        <p id="message" role="status"></p>

      </form>

      <p class="auth-bottom">
        <span data-i18n="alreadyAccount">
          Already have an account?
        </span>

        <a href="login.html" data-i18n="login">
          Login
        </a>
      </p>

    </div>
  </main>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <!-- TRANSLATIONS -->
  <script src="translations.js"></script>

  <script>
    const signupForm = document.getElementById("signupForm");
    const signupBtn = document.getElementById("signupBtn");
    const message = document.getElementById("message");
    const selectedPlan = document.getElementById("selectedPlan");

    const plans = {
      beginner: { price: 29 },
      pro: { price: 49 },
      premium: { price: 79 }
    };

    const params = new URLSearchParams(window.location.search);
    const plan = params.get("plan");

    function updateSelectedPlan() {
      if (!plan || !plans[plan]) {
        selectedPlan.textContent = "";
        return;
      }

      const labels = {
        en: "Selected Program",
        ar: "البرنامج المختار",
        he: "התוכנית שנבחרה",
        es: "Programa seleccionado",
        fr: "Programme sélectionné",
        de: "Gewähltes Programm",
        tr: "Seçilen Program",
        pt: "Programa selecionado",
        ru: "Выбранная программа",
        it: "Programma selezionato"
      };

      const lang = getLanguage();

      selectedPlan.textContent =
        (labels[lang] || labels.en) +
        ": " +
        t(plan) +
        " — ₪" +
        plans[plan].price +
        " " +
        t("month");
    }

    updateSelectedPlan();

    document.addEventListener(
      "bodymode:languagechange",
      updateSelectedPlan
    );

    signupForm.addEventListener("submit", async function(e) {
      e.preventDefault();

      const fullName =
        document.getElementById("fullName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      message.style.color = "#e8bc50";
      message.textContent = t("creatingAccount");
      signupBtn.disabled = true;

      try {
        if (typeof supabaseClient === "undefined") {
          throw new Error("Supabase is not configured.");
        }

        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                full_name: fullName
              }
            }
          });

        if (error) {
          throw error;
        }

        if (data.session) {
          const successMessages = {
            en: "Account created successfully!",
            ar: "تم إنشاء حسابك بنجاح!",
            he: "החשבון נוצר בהצלחה!",
            es: "¡Cuenta creada correctamente!",
            fr: "Compte créé avec succès !",
            de: "Konto erfolgreich erstellt!",
            tr: "Hesap başarıyla oluşturuldu!",
            pt: "Conta criada com sucesso!",
            ru: "Аккаунт успешно создан!",
            it: "Account creato con successo!"
          };

          const lang = getLanguage();

          message.textContent =
            successMessages[lang] || successMessages.en;

          setTimeout(function() {
            window.location.href = "dashboard.html";
          }, 1000);

        } else {
          const confirmationMessages = {
            en: "Check your email for a confirmation link. After confirming, log in.",
            ar: "افحص بريدك الإلكتروني واضغط رابط التأكيد، وبعدها سجّل الدخول.",
            he: "בדקו את האימייל לאישור החשבון, ולאחר מכן התחברו.",
            es: "Revisa tu correo para confirmar tu cuenta. Después, inicia sesión.",
            fr: "Vérifiez votre e-mail pour confirmer votre compte, puis connectez-vous.",
            de: "Prüfe deine E-Mail und bestätige dein Konto. Melde dich danach an.",
            tr: "Hesabını doğrulamak için e-postanı kontrol et, ardından giriş yap.",
            pt: "Verifique seu e-mail para confirmar sua conta e depois entre.",
            ru: "Проверьте почту и подтвердите аккаунт, затем войдите.",
            it: "Controlla l'email per confermare l'account, poi accedi."
          };

          const lang = getLanguage();

          message.textContent =
            confirmationMessages[lang] || confirmationMessages.en;

          signupBtn.disabled = false;
        }

      } catch (error) {
        console.error("Signup error:", error);

        message.style.color = "#ff6666";
        message.textContent =
          error.message || t("connectionError");

        signupBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
