<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Body Mode</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">⚡ Body Mode</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="courses.html">Courses</a>
    <a href="ai.html">AI Coach</a>
    <a href="#" id="logoutBtn">Logout</a>
  </nav>
</header>

<section class="dashboard-hero">
  <div class="auth-glow"></div>

  <h1><span>MY</span> DASHBOARD</h1>
  <p id="userEmail">Loading...</p>
</section>

<section class="dashboard-grid">
  <div class="dash-card">
    <div class="icon">📚</div>
    <h3>My Courses</h3>
    <p>Beginner Program</p>
    <a href="course.html" class="btn gold">OPEN COURSE →</a>
  </div>

  <div class="dash-card">
    <div class="icon">📈</div>
    <h3>Progress</h3>
    <p>25% completed</p>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>

  <div class="dash-card">
    <div class="icon">⚡</div>
    <h3>AI Coach</h3>
    <p>Ask training or nutrition questions.</p>
    <a href="ai.html" class="btn gold">OPEN AI COACH →</a>
  </div>
</section>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="script.js"></script>

<script>
async function protectDashboard() {
  const { data } = await supabaseClient.auth.getUser();

  if (!data.user) {
    window.location.href = "login.html";
    return;
  }

  document.getElementById("userEmail").textContent = data.user.email;
}

document.getElementById("logoutBtn").addEventListener("click", async function(e) {
  e.preventDefault();

  await supabaseClient.auth.signOut();
  showToast("Logged out successfully", "success");

  setTimeout(() => {
    window.location.href = "login.html";
  }, 1000);
});

protectDashboard();
</script>

</body>
</html>
